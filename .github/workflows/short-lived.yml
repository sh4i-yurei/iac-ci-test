# Disposable: shows the OIDC claims a reusable workflow gets when another repository calls it,
# and whether Tailscale accepts that token for an identity requiring this file's job_workflow_ref.
name: short-lived
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  claims:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Exchange the job's token with two Tailscale identities
        run: |
          for pair in "good TJqYefgm8i11CNTRL-kcFghrJwS711CNTRL" "other-file TJqYefgm8i11CNTRL-kobpz75LXi11CNTRL"; do
            set -- $pair
            jwt=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api.tailscale.com/$2" | jq -r .value)
            code=$(printf 'client_id=%s&jwt=%s' "$2" "$jwt" | curl -s -o /tmp/x.json -w '%{http_code}' --data-binary @- https://api.tailscale.com/api/v2/oauth/token-exchange)
            echo "EXCHANGE $1: HTTP $code $(jq -c '{message, error}' /tmp/x.json 2>/dev/null | head -c 200)"
            rm -f /tmp/x.json
          done
